[build-system]
# PEP 639 licence metadata needs setuptools 77 or later.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calbredge-protocol"
version = "0.3.0"
description = "Calbredge benchmark protocol engine — models, adapters, and statistics"
requires-python = ">=3.10"
# LICENSE is the Apache License 2.0 text, unmodified; NOTICE is the attribution
# notice its section 4(d) asks for. PyPI refuses any upload carrying a
# "Private ::" classifier.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
# RKNNAdapter's external KM003C USB power meter (protocol/calbredge_protocol/power_meter.py).
# Optional: never required for a benchmark run to succeed, only for the
# reference power/energy numbers it adds when a meter is physically present.
power-meter = ["pyusb>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
# Only the calbredge_protocol package: unrestricted discovery would also package a stale
# build/lib/ left by an earlier build.
include = ["calbredge_protocol", "calbredge_protocol.*"]

[tool.setuptools.package-data]
"calbredge_protocol.protocols" = ["*.yaml"]
