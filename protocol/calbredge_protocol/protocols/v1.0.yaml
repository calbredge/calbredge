# Calbredge Benchmark Protocol — v1.0
#
# This file defines the canonical default benchmark protocol used when no
# custom protocol is specified. All Calbredge results tagged "1.0" were
# produced under these exact conditions, making cross-device comparisons valid.
#
# Field reference:
#
#   protocol_version (required)
#     Identifies the protocol specification. Pinned into every BenchmarkResult
#     so the dashboard can enforce like-for-like comparisons. Increment on any
#     change that would make results incompatible with prior runs.
#
#   warmup_iterations (default: 50)
#     Inference passes run before measurement begins. Results are discarded.
#     Warmup primes the runtime: JIT compilation, memory allocation, and CPU/GPU
#     cache warming all happen here. 50 passes ensures JIT effects are fully
#     cleared, GPU clocks have stabilized (critical on Jetson where clocks ramp
#     under load), caches are warm across all model layers, and runtime
#     initialization overhead is excluded from measurements.
#
#   measurement_iterations (default: 500)
#     Inference passes whose latencies are recorded. p50/p90/p99 are derived
#     from exactly this many samples. 500 gives stable percentile estimates —
#     p99 from 100 samples is the worst result in 100 runs (statistically noisy);
#     p99 from 500 samples is significantly more stable. Sufficient to detect
#     variance patterns and flag unstable runs. Aligns with MLPerf practice.
#
#   batch_size (default: 1)
#     Inputs processed per inference call. Edge deployment typically targets
#     batch_size=1 (real-time, single-frame). Throughput is calculated as
#     batch_size / median_latency_s.
#
#   input_shape (required)
#     Tensor shape passed to the runtime, in NCHW order. [1, 3, 224, 224]
#     matches the canonical ImageNet input used by MobileNet, ResNet, and most
#     common edge vision models. Adjust for models with different input sizes.
#
#   power_mode (default: "default")
#     Performance/power hint forwarded to the device driver or runtime.
#     "default" leaves the OS scheduler in control. Use "max_performance" or
#     device-specific values when benchmarking peak throughput; use
#     "power_save" when benchmarking energy efficiency.
#
#   runtime_config (default: {})
#     Freeform key/value settings forwarded verbatim to the RuntimeAdapter.
#     Leave empty to use each runtime's built-in defaults. Populate for
#     adapter-specific tuning (e.g. ONNX execution providers, TensorRT
#     precision flags, RKNN core mask).

protocol_version: "1.0"
warmup_iterations: 50
measurement_iterations: 500
batch_size: 1
input_shape: [1, 3, 224, 224]
power_mode: "default"
runtime_config: {}
